name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: |
          pip install flet
          yes | flet build apk
      - uses: actions/upload-artifact@v4
        with:
          name: Unitatry-APK
          path: build/apk/*.apk
